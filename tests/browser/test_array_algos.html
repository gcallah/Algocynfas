<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<script src="harness.js"></script>
<script>
// arrayAlgos.html: maximum subarray (both ways), Hoare partition, min and max.
runTests(async () => {
  const f = await load("arrayAlgos.html");
  const w = f.contentWindow, d = f.contentDocument;
  await sleep(500);
  d.getElementById('Fast').checked = true;
  const set = (id, v) => d.getElementById(id).value = v;
  const pick = (id) => { d.getElementById(id).checked = true; w.algoChanged(); };
  const result = () => d.getElementById('result').textContent;
  const finalArray = () => w.eval('A.dataElems.map((e) => e.key)');
  const runOn = async (algo, list) => {
    pick(algo); set('number-input', list.join(', '));
    w.run(); await waitDone(d);
    return result();
  };

  const arrays = [
    [13, -3, -25, 20, -3, -16, -23, 18, 20, -7, 12, -5, -22, 15, -4, 7],   // CLRS Fig. 4.3
    [-8, -3, -6, -2, -5, -4], [5], [1, 2, 3, 4], [-1, 3, -1, 3, -10, 4], [0, 0, 0],
  ];
  for (const a of arrays) {
    // Brute force: the largest sum over all subarrays.
    let best = -Infinity;
    for (let i = 0; i < a.length; i++) {
      let s = 0;
      for (let j = i; j < a.length; j++) { s += a[j]; best = Math.max(best, s); }
    }
    for (const algo of ['maxsubDC', 'maxsubLinear']) {
      const res = await runOn(algo, a);
      const m = res.match(/A\[(\d+)\.\.(\d+)\].*with sum (-?\d+)/);
      const ok = m && +m[3] === best &&
                 a.slice(+m[1] - 1, +m[2]).reduce((x, y) => x + y, 0) === best;
      check(ok, `${algo} on [${a}] (best sum ${best})`, res);
    }
  }

  for (const a of [[13, 19, 9, 5, 12, 8, 7, 4, 11, 2, 6, 21], [5, 3, 8, 1, 9, 2], [2, 1],
                   [7, 7, 7, 7], [1, 2, 3, 4, 5], [5, 4, 3, 2, 1]]) {
    const res = await runOn('hoare', a);
    const m = res.match(/returns j = (\d+)/);
    const out = finalArray();
    const j = m ? +m[1] : -1;
    const ok = m && j >= 1 && j < a.length &&
               String(out.slice().sort((x, y) => x - y)) === String(a.slice().sort((x, y) => x - y)) &&
               Math.max(...out.slice(0, j)) <= Math.min(...out.slice(j));
    check(ok, `Hoare partition of [${a}]`, res + ' / ' + out);
  }

  for (const a of [[31, 41, 59, 26, 53, 58, 97, 93, 23], [3, 1], [4], [2, 9, 9, 1, 5, 5],
                   [-5, -9, 0, 12]]) {
    const res = await runOn('minmax', a);
    const m = res.match(/min = (-?\d+).*max = (-?\d+).*using (\d+) comparisons/);
    const ok = m && +m[1] === Math.min(...a) && +m[2] === Math.max(...a) &&
               +m[3] <= 3 * Math.floor(a.length / 2);
    check(ok, `min and max of [${a}]`, res);
  }

  pick('maxsubDC'); set('number-input', '13, -3, -25, 20, -3, -16, -23, 18');
  w.run(); await sleep(1500); w.stopAnime(); await waitDone(d);
  check(d.getElementById('status').textContent === 'Stopped.', 'Stop halts the run');
  w.run(); await waitDone(d);
  check(result().includes('with sum 20'), 'runs again after Stop', result());
});
</script>
</body></html>
