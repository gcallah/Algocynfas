<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<script src="harness.js"></script>
<script>
// search.html: linear search, binary search, Randomized-Select.
runTests(async () => {
  const f = await load("search.html");
  const w = f.contentWindow, d = f.contentDocument;
  await sleep(300);
  d.getElementById('Fast').checked = true;
  const set = (id, v) => d.getElementById(id).value = v;
  const pick = (id) => { d.getElementById(id).checked = true; w.algoChanged(); };
  const result = () => d.getElementById('result').textContent;

  const searches = [
    ['binary', '2,5,8,12,16,23,38,56,72,91', 23, 'found at A[6]'],
    ['binary', '2,5,8,12,16,23,38,56,72,91', 2, 'found at A[1]'],
    ['binary', '2,5,8,12,16,23,38,56,72,91', 91, 'found at A[10]'],
    ['binary', '3,9,14,21,27,35,44,50', 30, 'not in A'],
    ['binary', '9,3,7,1', 7, 'found at A[3]'],        // sorted first: 1,3,7,9
    ['linear', '31,41,59,26,41,58', 41, 'found at A[2]'],
    ['linear', '31,41,59,26,41,58', 99, 'not in A'],
  ];
  for (const [algo, list, v, want] of searches) {
    pick(algo); set('number-input', list); set('target-input', v);
    w.run(); await waitDone(d);
    check(result().includes(want), `${algo} search for ${v} in [${list}]`, result());
  }

  const list = [31, 41, 59, 26, 41, 58, 12, 7, 93];
  const sorted = list.slice().sort((a, b) => a - b);
  for (const pivot of ['random', 'last']) {
    for (let i = 1; i <= list.length; i++) {
      pick('select'); set('number-input', list.join(',')); set('rank-input', i);
      set('pivot-choice', pivot);
      w.run(); await waitDone(d);
      check(result().includes('smallest element is ' + sorted[i - 1] + ' '),
            `select (${pivot} pivot) i=${i}`, result());
    }
  }

  pick('select'); set('number-input', '5,4,3,2,1'); set('rank-input', 2);
  w.run(); await sleep(1200); w.stopAnime(); await waitDone(d);
  check(d.getElementById('status').textContent === 'Stopped.', 'Stop halts the run');
  w.run(); await waitDone(d);
  check(result().includes('smallest element is 2 '), 'runs again after Stop', result());
});
</script>
</body></html>
