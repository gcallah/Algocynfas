<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Searching and Selection</title>
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="userInterface.css">
  <script src="lib/jquery.min.js"></script>
  <script src="lib/bootstrap.min.js"></script>
  <script src="lib/fabric.js"></script>
  <script src="algocynfas.js"></script>
  <script src="widgets.js"></script>
  <script src="search.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Searching and Selection</h1>
  <div class="container">
    <p class="algo-note">
      Find a value in an array, or find the <i>i</i>th smallest element without
      sorting. Indices start at 1, as in CLRS.
    </p>

    <div class="controls">
      <b>Algorithm:</b>
      <span class="opt"><input type="radio" name="algo" id="linear" onchange="algoChanged()"> <label for="linear">Linear Search (Ex. 2.1-3)</label></span>
      <span class="opt"><input type="radio" name="algo" id="binary" onchange="algoChanged()" checked> <label for="binary">Binary Search (Ex. 2.3-5)</label></span>
      <span class="opt"><input type="radio" name="algo" id="select" onchange="algoChanged()"> <label for="select">Randomized-Select (9.2)</label></span>
    </div>

    <div class="controls">
      <b>Speed:</b>
      <span class="opt"><input type="radio" name="speed" value="500" id="Fast"> <label for="Fast">Fast</label></span>
      <span class="opt"><input type="radio" name="speed" value="1000" id="Medium" checked> <label for="Medium">Medium</label></span>
      <span class="opt"><input type="radio" name="speed" value="2000" id="Slow"> <label for="Slow">Slow</label></span>
    </div>

    <div class="controls">
      <b>Sample input:</b>
      <select id="searchSample" onchange="setSearchSample()">
        <option value="">Select one</option>
        <option value="unsorted">Unsorted array</option>
        <option value="sorted">Sorted array</option>
        <option value="missing">Target not present</option>
        <option value="dups">Duplicate values</option>
      </select>
    </div>

    <div class="controls">
      <label for="number-input"><b>A =</b></label>
      <input type="text" id="number-input" style="width: 24em; max-width: 100%"
             value="2, 5, 8, 12, 16, 23, 38, 56, 72, 91"
             placeholder="Up to 12 integers from -99 to 99, separated by commas">
      <button class="btn btn-primary" type="button" onclick="showList()">Show Array</button>
    </div>

    <div class="controls">
      <span id="target-group">
        <label for="target-input"><b>Search for v =</b></label>
        <input type="text" id="target-input" class="box" style="width: 5em" value="23">
      </span>
      <span id="rank-group" style="display: none">
        <label for="rank-input"><b>Find the <i>i</i>th smallest, i =</b></label>
        <input type="text" id="rank-input" class="box" style="width: 4em" value="3">
      </span>
      <span id="pivot-group" style="display: none">
        <label for="pivot-choice"><b>Pivot:</b></label>
        <select id="pivot-choice">
          <option value="random">Random (RANDOMIZED-PARTITION)</option>
          <option value="last">Last element (PARTITION)</option>
        </select>
      </span>
      <button id="run-button" type="button" class="btn btn-success" onclick="run()">Run</button>
      <button id="stop-button" type="button" class="btn btn-danger" onclick="stopAnime()">Stop</button>
    </div>
    <p id="sorted-note" class="algo-note">Binary search needs a sorted array; unsorted input is sorted first.</p>

    <footer id="searchLegend"></footer>
    <div id="status" class="status"></div>
    <canvas id="searchCanvas" width="800" height="150"></canvas>
    <div id="result" class="result"></div>
  </div>

  <script>
    display_legend_list("searchLegend", [
      ["In range", RANGE_COLOR], ["Being compared", CURRENT_COLOR], ["Found", FOUND_COLOR],
      ["&le; pivot", LOW_SIDE_COLOR], ["&gt; pivot", HIGH_SIDE_COLOR], ["Pivot", PIVOT_COLOR]]);
    canvas = new fabric.Canvas('searchCanvas');
    // Wait for the web font so the boxes are measured in it.
    document.fonts.ready.then(showList);
  </script>
</body>
</html>
