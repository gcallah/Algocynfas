<!DOCTYPE html>
<!-- The source of og-image.png, the picture shown when a link to the site is
     shared. Rebuild it with bin/og_image.sh after changing this file. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Inter", system-ui, sans-serif;
    color: #1c2833;
    background:
      radial-gradient(circle at 1px 1px, rgba(43, 94, 167, 0.13) 1.2px, transparent 0) 0 0 / 22px 22px,
      linear-gradient(135deg, #f4f9f8 0%, #e4f3f5 55%, #dde9f4 100%);
  }
  .bg {
    position: absolute; inset: 0;
    background: url("algo-bg.svg") center / cover no-repeat;
    opacity: 0.22;
  }
  .band {
    position: absolute; left: 0; right: 0; bottom: 0; height: 12px;
    background: linear-gradient(90deg, #2f6f45, #1fa5b8, #2b5ea7, #6b4fa0);
  }
  .text {
    position: absolute; left: 72px; top: 92px; width: 540px;
  }
  .kicker {
    font-weight: 600; font-size: 22px; letter-spacing: 0.14em;
    text-transform: uppercase; color: #1fa5b8; margin-bottom: 14px;
  }
  h1 {
    font-family: "Space Grotesk", sans-serif; font-weight: 700;
    font-size: 104px; line-height: 1; margin: 0 0 26px;
    color: #1d4a5c; letter-spacing: -0.02em;
  }
  p {
    font-size: 33px; line-height: 1.32; margin: 0 0 34px; color: #2c3e4c;
    font-weight: 500;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    font-weight: 600; font-size: 21px; padding: 8px 18px; border-radius: 999px;
    background: #fff; border: 2px solid; box-shadow: 0 2px 6px rgba(20, 40, 60, 0.08);
  }
  svg.art { position: absolute; right: 30px; top: 40px; }
</style>
</head>
<body>
<div class="bg"></div>

<div class="text">
  <div class="kicker">Algorithms, animated</div>
  <h1>Algocynfas</h1>
  <p>Watch the CLRS algorithms run, step by step, in your browser.</p>
  <div class="chips">
    <span class="chip" style="border-color:#2b5ea7;color:#2b5ea7">Sorting</span>
    <span class="chip" style="border-color:#2f6f45;color:#2f6f45">Trees</span>
    <span class="chip" style="border-color:#6b4fa0;color:#6b4fa0">Graphs</span>
    <span class="chip" style="border-color:#1fa5b8;color:#167f8e">Dynamic programming</span>
  </div>
</div>

<svg class="art" width="540" height="560" viewBox="0 0 540 560">
  <defs>
    <!-- Node shading as in sigma_style.js: lit from the upper left. -->
    <radialGradient id="gBlue" cx="0.33" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#8aa9d3"/><stop offset="0.55" stop-color="#2b5ea7"/><stop offset="1" stop-color="#234d89"/>
    </radialGradient>
    <radialGradient id="gCyan" cx="0.33" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#85d0da"/><stop offset="0.55" stop-color="#1fa5b8"/><stop offset="1" stop-color="#198797"/>
    </radialGradient>
    <radialGradient id="gViolet" cx="0.33" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ad9cca"/><stop offset="0.55" stop-color="#6b4fa0"/><stop offset="1" stop-color="#584183"/>
    </radialGradient>
    <radialGradient id="gGreen" cx="0.33" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#90b49c"/><stop offset="0.55" stop-color="#2f6f45"/><stop offset="1" stop-color="#275b39"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14283c" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a86c2"/><stop offset="1" stop-color="#2b5ea7"/>
    </linearGradient>
    <linearGradient id="barHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc0cf"/><stop offset="1" stop-color="#1fa5b8"/>
    </linearGradient>
    <linearGradient id="barDone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9a72"/><stop offset="1" stop-color="#2f6f45"/>
    </linearGradient>
  </defs>

  <!-- A search tree, with the search path to 13 picked out (8, 10, 12, 13). -->
  <g stroke-linecap="round">
    <g stroke="#9aa6b2" stroke-width="4">
      <line x1="270" y1="60" x2="150" y2="150"/>
      <line x1="150" y1="150" x2="85" y2="240"/>
      <line x1="150" y1="150" x2="215" y2="240"/>
      <line x1="390" y1="150" x2="455" y2="240"/>
      <line x1="330" y1="240" x2="290" y2="325"/>
    </g>
    <g stroke="#1fa5b8" stroke-width="6">
      <line x1="270" y1="60" x2="390" y2="150"/>
      <line x1="390" y1="150" x2="330" y2="240"/>
      <line x1="330" y1="240" x2="370" y2="325"/>
    </g>
  </g>
  <g font-family="Inter, sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#fff">
    <circle cx="270" cy="60" r="44" fill="#1fa5b8" opacity="0.22"/>
    <g filter="url(#shadow)" stroke="#fff" stroke-width="5">
      <circle cx="270" cy="60" r="36" fill="url(#gCyan)"/>
      <circle cx="150" cy="150" r="32" fill="url(#gBlue)"/>
      <circle cx="390" cy="150" r="32" fill="url(#gCyan)"/>
      <circle cx="85" cy="240" r="30" fill="url(#gBlue)"/>
      <circle cx="215" cy="240" r="30" fill="url(#gBlue)"/>
      <circle cx="330" cy="240" r="30" fill="url(#gCyan)"/>
      <circle cx="455" cy="240" r="30" fill="url(#gBlue)"/>
      <circle cx="290" cy="325" r="27" fill="url(#gBlue)"/>
      <circle cx="370" cy="325" r="31" fill="url(#gViolet)"/>
    </g>
    <circle cx="370" cy="325" r="40" fill="none" stroke="#6b4fa0" stroke-width="3" opacity="0.45"/>
    <text x="270" y="61" font-size="30">8</text>
    <text x="150" y="151" font-size="27">3</text>
    <text x="390" y="151" font-size="27">10</text>
    <text x="85" y="241" font-size="25">1</text>
    <text x="215" y="241" font-size="25">6</text>
    <text x="330" y="241" font-size="25">12</text>
    <text x="455" y="241" font-size="25">19</text>
    <text x="290" y="326" font-size="23">11</text>
    <text x="370" y="326" font-size="25">13</text>
  </g>

  <!-- Bars partway through a sort: the right end is done. -->
  <g filter="url(#shadow)">
    <rect x="40"  y="452" width="40" height="78"  rx="7" fill="url(#bar)"/>
    <rect x="94"  y="420" width="40" height="110" rx="7" fill="url(#barHot)"/>
    <rect x="148" y="472" width="40" height="58"  rx="7" fill="url(#barHot)"/>
    <rect x="202" y="436" width="40" height="94"  rx="7" fill="url(#bar)"/>
    <rect x="256" y="462" width="40" height="68"  rx="7" fill="url(#bar)"/>
    <rect x="310" y="408" width="40" height="122" rx="7" fill="url(#barDone)"/>
    <rect x="364" y="396" width="40" height="134" rx="7" fill="url(#barDone)"/>
    <rect x="418" y="384" width="40" height="146" rx="7" fill="url(#barDone)"/>
    <rect x="472" y="370" width="40" height="160" rx="7" fill="url(#barDone)"/>
  </g>
</svg>

<div class="band"></div>
</body>
</html>
